# ============================================================================
# Nav2 parameters for Athena GPS navigation (Nav2 1.1.x / ROS 2 Humble)
#
# Map-less outdoor navigation:
#   - no AMCL / map_server: localization comes from the dual EKF (map frame)
#   - rolling-window global costmap (no static layer)
#   - obstacles from the D435i depth cloud (downsampled) via the voxel layer
#   - Regulated Pure Pursuit controller: cheap on the Jetson and a good match
#     for the Pico's quantized F/B/L/R drive protocol
#
# Robot assumptions (adjust!):
#   footprint 1.0 m wide x 1.3 m long (measured 2026-08-31), camera front-
#   center, cruise speed ~0.35 m/s, turn-in-place capable. Rectangular
#   `footprint` used instead of `robot_radius` - a circumscribed circle for
#   this aspect ratio would be ~0.82 m radius, needlessly conservative on
#   the long axis. Assumes base_link sits at the chassis's geometric
#   center; correct the offsets below if the drive axle isn't centered.
# ============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    bt_loop_duration: 10
    # Milliseconds the behaviour tree waits for a Nav2 server to ACKNOWLEDGE a
    # goal before calling that step a failure (also its budget for cancel and
    # result on halt).  Stock 20 ms is too tight on this Jetson at load 7-11:
    # the logs have 14 "Timed out while waiting for action server to
    # acknowledge goal request for compute_path_to_pose" (2026-08-29 to
    # 10-02), plus wait/backup/spin/follow_path, and ~30 "Failed to get result
    # for follow_path in node halt!".  Each timeout fails ComputePathToPose,
    # which costs a retry or a whole recovery round for nothing.  100 ms
    # absorbs scheduling delay; a server that is really gone still fails in
    # a tenth of a second.  Raise to 200 if the warning still appears.
    default_server_timeout: 100
    # Athena's own tree: Nav2's stock one with the Spin and BackUp recoveries
    # removed, because both move the rover through space it cannot see (87
    # degree camera, nothing facing backwards).  See the comment at the top
    # of that file.  Delete this line to go back to the stock behaviour.
    # The $(find-pkg-share) substitution works because nav2_bringup's
    # navigation_launch.py builds this file with allow_substs=True.
    default_nav_to_pose_bt_xml: $(find-pkg-share athena_gps_nav)/behavior_trees/athena_nav_to_pose.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    # MUST be set.  Nav2's default is the bare topic "odom", which nothing in
    # this stack publishes -- ekf_local publishes /odometry/local.  With no
    # publisher, controller_server's OdomSmoother reports speed 0.0 forever,
    # and RegulatedPurePursuit's getLookAheadDistance() does:
    #     lookahead = clamp(|speed.linear.x| * lookahead_time, min, max)
    # so the lookahead is pinned at min_lookahead_dist (0.4 m) permanently and
    # lookahead_dist / max_lookahead_dist are dead config.  A 0.4 m carrot on a
    # 1.3 m rover means only 0.4*tan(0.5) = 0.22 m of lateral error is enough to
    # trip shouldRotateToPath(), which zeroes linear.x and spins in place.  That
    # was the "rover just yaws instead of driving" bug (diagnosed 2026-09-02).
    # bt_navigator (above) and velocity_smoother (below) already set this; this
    # node was the one that was missed.
    odom_topic: /odometry/local
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # bang-bang drive is slow to get going: be patient
      required_movement_radius: 0.3
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # GPS-grade tolerances: don't chase centimetres with a ~2 m sensor
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      # FIXED lookahead, not velocity-scaled.  Measured on hardware
      # 2026-09-04: with scaling on, the lookahead is
      #     clamp(|speed.linear.x| * lookahead_time, min, max)
      # and speed is ZERO at the moment every goal starts, so the carrot is
      # pinned at min_lookahead_dist (0.4 m).  The rover's own footprint
      # reaches x = +0.65, so a 0.4 m carrot sits INSIDE the robot.  NavFn
      # snaps the path start to a 0.1 m grid cell, and that snap alone put
      # the 0.4 m carrot at -0.58 rad - past rotate_to_heading_min_angle
      # (0.5) - so RPP zeroed linear.x and turned in place.  It could not
      # recover, because building speed is what would have lengthened the
      # lookahead in the first place.  Chicken and egg.
      #
      # Measured with a 2 m goal down a clear corridor:
      #   velocity-scaled, 0.4 m carrot : linear.x = 0.000 on 160/160 cycles
      #   fixed 1.0 m carrot            : linear.x = 0.350 on 178/178 cycles
      #
      # 1.0 m keeps the carrot clear of the footprint with margin. Velocity
      # scaling buys little on a rover whose speed range is 0 to 0.35 m/s.
      lookahead_dist: 1.0
      # Unused while use_velocity_scaled_lookahead_dist is false. Kept, and
      # raised past the 0.65 m footprint, so re-enabling scaling cannot
      # reintroduce a carrot inside the robot.
      min_lookahead_dist: 0.9
      max_lookahead_dist: 1.5
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5
      # 0.8 rad/s was too fast for the odometry underneath it.  VIO runs
      # 10 Hz outdoors and collapses to 2-4 Hz indoors, so at 0.8 rad/s the
      # rover sweeps 12-25 degrees between pose updates and every cloud
      # arriving in that gap is placed with a stale heading.  At 3 m range
      # that smears an obstacle by up to 0.8 m, and because nothing in the
      # costmap decays with time, the smear stays marked after the camera
      # has looked away.  Turning in place is exactly when this is worst.
      # 0.4 halves it. If VIO is running at 2-4 Hz indoors, go lower still.
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 1.5
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      # Publishing only feeds the /local_costmap/costmap TOPIC (Foxglove,
      # RViz); the controller reads this costmap in-process, so this changes
      # nothing about how the rover drives.  The publish check runs inside the
      # 5 Hz update loop, so 2.0 really meant "every third 0.2 s tick" =
      # 1.67 Hz (measured).  Any value above update_frequency publishes on
      # every update, i.e. 5 Hz: 25 KiB x 5 = 0.13 MB/s to the panel.
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Was 4 x 4 m = only +/-2 m around base_link, while the rover itself is
      # 1.3 x 1.0 m with 0.9 m inflation - almost no free margin left, and
      # obstacle_max_range 3.0 / raytrace_max_range 3.5 both fell OUTSIDE the
      # map, throwing away most of the sensor range.  8 m covers the full
      # raytrace range in both directions.
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[0.65, 0.5], [0.65, -0.5], [-0.65, -0.5], [-0.65, 0.5]]"
      plugins: ["stvl_layer", "inflation_layer"]
      # Obstacles: spatio_temporal_voxel_layer (apt ros-humble-spatio-
      # temporal-voxel-layer), not nav2_costmap_2d::VoxelLayer.
      #
      # VoxelLayer only clears a voxel when a ray from the camera passes
      # through it to a return BEHIND it.  Its observation source drops every
      # point below min_obstacle_height before using the cloud for marking
      # OR clearing, so the floor (about 60% of the cloud) never cast a ray,
      # and the rays that were left, from a lens 0.65 m up to things at
      # least 0.20 m tall, pass above the lower part of anything that has
      # since gone.  An object taken away from in front of the rover stayed
      # marked until the rover drove over it or the cell scrolled out of
      # the window.  Adding a floor-only clearing source helps low objects
      # close in, but nothing can clear a voxel with open sky behind it.
      #
      # STVL instead clears what the camera's view frustum says should be
      # visible and is not being seen: a voxel inside the frustum that no
      # new point re-marks is removed within about 1 s, whatever is behind
      # it.  Outside the frustum (rover turned away, or the obstacle is now
      # below the camera's view near the bumper) voxels are kept, then
      # expire voxel_decay seconds after they were last seen.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        publish_voxel_map: False
        voxel_size: 0.05
        # Linear decay: a voxel nobody re-observes expires 30 s after it was
        # last marked.  That is the memory for obstacles that left the view.
        # Bounded, so the grid cannot grow without limit over a long run.
        decay_model: 0
        voxel_decay: 30.0
        # 0 means a single voxel in a column marks the whole column lethal,
        # as before with VoxelLayer.
        mark_threshold: 0
        track_unknown_space: True
        update_footprint_enabled: True
        combination_method: 1
        origin_z: 0.0
        transform_tolerance: 0.2
        mapping_mode: False
        map_save_duration: 60.0
        observation_sources: realsense_mark realsense_clear
        realsense_mark:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points_downsampled
          marking: True
          clearing: False
          # STVL applies min/max_obstacle_height ONLY inside this filter.
          # With filter "" there is no height cut at all and the floor is
          # marked lethal everywhere (measured: ~2000 cells).  Never blank it.
          filter: "passthrough"
          voxel_min_points: 0
          min_obstacle_height: 0.10
          max_obstacle_height: 1.8
          obstacle_range: 3.0
          inf_is_valid: False
          observation_persistence: 0.0
          clear_after_reading: True
          # Seconds. 0.0 (the old value, by omission) means Nav2 never checks
          # whether the camera is still alive: a wedged RealSense leaves the
          # last obstacles frozen in place and the rover drives on data that
          # stopped being true minutes ago, with no warning anywhere.  The
          # cloud arrives at 5-8 Hz, so 2 s is a wide margin.  When it does
          # trip, the costmap reports itself not-current and the controller
          # refuses to drive. That is the correct response to a blind rover,
          # but it does mean a flaky camera now stops the rover instead of
          # silently risking it.
          expected_update_rate: 2.0
        realsense_clear:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points_downsampled
          marking: False
          clearing: True
          model_type: 0
          # The frustum must sit INSIDE what the camera really sees, or it
          # erases obstacles the camera cannot see.  Measured on the live
          # cloud: +/-39.5 deg horizontal, +/-32.2 deg vertical.  STVL's
          # geometry is not the obvious one: vertical half-angle =
          # vertical_fov_angle/2, horizontal half-angle =
          # atan(tan(horizontal_fov_angle/2) / cos(vertical_fov_angle/2)),
          # and the far plane sits at max_z * cos(v/2) * cos(h/2) along the
          # optical axis.  So 1.05 / 1.17 rad give 30.0 / 37.4 deg (about 2
          # deg inside the camera), and max_z 4.2 puts the far plane at
          # 3.03 m, covering obstacle_range.  min_z 0.45 puts the near plane
          # at 0.32 m, past the D435i's minimum depth.  Re-derive all four
          # if the depth profile or the camera changes.
          vertical_fov_angle: 1.05
          horizontal_fov_angle: 1.17
          min_z: 0.45
          max_z: 4.2
          # How fast unobserved voxels inside the frustum die (1/s^2): with
          # voxel_decay 30 this clears a removed object in about 1.0 s.
          # 20 was measured too aggressive: an obstacle in plain view
          # vanished for one update in a normal cloud gap.
          decay_acceleration: 10.0
          # Must be True.  Otherwise the last clearing cloud is re-applied
          # every update even when no new cloud has come in, and a 1.5 s
          # camera stall erased an obstacle in plain view (measured: 54 ->
          # 0 cells) before expected_update_rate could flag it.
          clear_after_reading: True
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Must be >= the footprint's circumscribed radius, which for the
        # confirmed 1.3 x 1.0 m footprint is hypot(0.65, 0.5) = 0.82 m.
        # It was 0.6: Nav2 warns, and there was no cost gradient covering the
        # rover's own corner sweep.  0.9 clears it with a modest margin.
        inflation_radius: 0.9
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # Rolling, because there is no prior map: the costmap follows the rover
      # rather than covering a fixed area.  That means the planner can only
      # see width/2 in any direction, so 60 m capped every leg at ~30 m.
      # 100 m gives ~50 m legs. At 0.1 m resolution this is 1e6 cells, about
      # 1 MB, which is nothing on this Jetson - but see
      # always_send_full_costmap below, which is what actually made the old
      # size feel expensive.
      rolling_window: True
      width: 100
      height: 100
      resolution: 0.1
      footprint: "[[0.65, 0.5], [0.65, -0.5], [-0.65, -0.5], [-0.65, 0.5]]"
      # false since the STVL switch (2026-10-02).  STVL only ever writes
      # obstacle cells, never "seen and free" ones, so with true every other
      # cell stayed NO_INFORMATION, and InflationLayer does not spread its
      # gradient into unknown cells: measured 710 lethal + 4 inflated cells,
      # i.e. no keep-away margin for the planner at all.  The old VoxelLayer
      # hid this because its clearing rays wrote FREE cells.  With false,
      # unseen space is plain free (the local costmap already works this way)
      # and every obstacle gets its 1.2 m gradient again.
      track_unknown_space: false
      plugins: ["stvl_layer", "inflation_layer"]
      # Same layer and sources as local_costmap above; see the comments
      # there.  Differences: 0.1 m voxels to match this map, and the
      # PERSISTENT decay model, so obstacles outside the camera's view are
      # remembered for planning until the camera sees them gone (or the
      # node restarts).  decay_model -1 makes voxel_decay the in-frustum
      # budget only: with decay_acceleration 5 a removed object clears in
      # about 1.5 s at this map's 2 Hz.  Persistent voxels outside the
      # 100 m window are never dropped; at 0.1 m that is small, but watch
      # planner_server memory on very long runs.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        publish_voxel_map: False
        voxel_size: 0.1
        decay_model: -1
        voxel_decay: 15.0
        mark_threshold: 0
        track_unknown_space: True
        update_footprint_enabled: True
        combination_method: 1
        origin_z: 0.0
        transform_tolerance: 0.2
        mapping_mode: False
        map_save_duration: 60.0
        observation_sources: realsense_mark realsense_clear
        realsense_mark:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points_downsampled
          marking: True
          clearing: False
          filter: "passthrough"
          voxel_min_points: 0
          min_obstacle_height: 0.10
          max_obstacle_height: 1.8
          obstacle_range: 3.0
          inf_is_valid: False
          observation_persistence: 0.0
          clear_after_reading: True
          expected_update_rate: 2.0
        realsense_clear:
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points_downsampled
          marking: False
          clearing: True
          model_type: 0
          vertical_fov_angle: 1.05
          horizontal_fov_angle: 1.17
          min_z: 0.45
          max_z: 4.2
          decay_acceleration: 5.0
          clear_after_reading: True
          observation_persistence: 0.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # The GLOBAL map deliberately inflates wider and more gently than the
        # local one above.  This map shapes the route, so a broad soft
        # gradient makes the planner curve away from obstacles early rather
        # than only reacting once they are close.  The local map controls, so
        # it stays tight at 0.9 with a steeper factor: inflating that one
        # this wide would box the controller in and it would start refusing
        # gaps the rover actually fits through.
        # Both must stay >= the footprint's circumscribed radius, which for
        # the confirmed 1.3 x 1.0 m footprint is hypot(0.65, 0.5) = 0.82 m.
        cost_scaling_factor: 2.0
        inflation_radius: 1.2
      # False, not True.  At 100 x 100 m and 0.1 m this grid is 1e6 cells,
      # and True republishes every one of them at publish_frequency (1 Hz) =
      # ~1 MB/s, all of it down the SSH tunnel to Foxglove.  False sends
      # incremental updates instead.  The local costmap keeps True because
      # it is only 160 x 160 cells.
      always_send_full_costmap: False

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 1.0
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # This is the speed the Spin recovery turns at, and Spin is BLIND: the
    # D435i sees 87 degrees, so the rover is rotating into 273 degrees it
    # cannot see, using a costmap whose memory of that space is stale.
    # Matched to rotate_to_heading_angular_vel for the same smearing reason.
    max_rotational_vel: 0.5
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 1000

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Angular was 1.2 rad/s, well above anything upstream actually asks for
    # (RPP turns at 0.4, the Spin recovery at 0.5).  A ceiling that high only
    # matters when something misbehaves, and then it lets it misbehave fast.
    # 0.6 leaves headroom over both without allowing a runaway spin.
    max_velocity: [0.5, 0.0, 0.6]
    min_velocity: [-0.5, 0.0, -0.6]
    max_accel: [0.5, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -1.5]
    odom_topic: "/odometry/local"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
